[package]
name = "snowdown"
version = "0.1.0"
description = "A thoughtful local-first Bilibili downloader"
authors = ["SnowDown"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "snowdown_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "sync", "time", "macros", "rt-multi-thread", "net"] }
futures-util = "0.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
md5 = "0.7"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
