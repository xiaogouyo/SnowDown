<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SnowDown</title><link rel="stylesheet" href="style.css"></head><body class="popup-shell">
<header><button id="brand" title="切换平台视频／网页资源模式"><img src="icons/32.png" alt=""><strong>SnowDown<span>.</span></strong></button><span id="connection" class="badge">浏览器下载</span><button id="settingsButton" class="icon" title="设置">⚙</button></header>
<main>
<nav><button id="platformMode" class="active">平台视频</button><button id="resourceMode">网页资源</button></nav>
<section id="platform"><div class="intro"><span class="eyebrow">留住喜欢的内容</span><h1 id="pageTitle">当前页面视频</h1><p id="platformLabel">B站 · 抖音 · 小红书</p></div><button id="parse" class="primary wide">读取当前视频</button><button id="reparse" class="secondary" hidden>重新解析</button><article id="video" hidden><img id="cover" alt="视频封面"><div><h2 id="videoTitle"></h2><p id="author"></p><div id="quickFormats" class="quick-formats"></div></div><label>画质<select id="quality"></select></label><button id="downloadVideo" class="primary wide">下载视频</button></article></section>
<section id="resources" hidden>
<div class="resource-tabs" role="group" aria-label="资源分类"><button data-resource-kind="all" class="active" title="全部">▦ 全部</button><button data-resource-kind="image" title="图片">▧ 图片</button><button data-resource-kind="video" title="视频">▷ 视频</button><button data-resource-kind="audio" title="音频">♫ 音频</button><button data-resource-kind="document" title="文档">▤ 文档</button><button data-resource-kind="manifest" title="播放清单">≡ 清单</button></div>
<select id="kind" hidden aria-label="资源类型"><option value="all">全部</option><option value="image">图片</option><option value="video">视频</option><option value="audio">音频</option><option value="document">文档</option><option value="manifest">清单</option></select>
<div class="dimension-filter"><label>宽度 <input id="width" type="number" min="0" value="0" aria-label="最小宽度"><input id="widthRange" type="range" min="0" max="4096" value="0" aria-label="宽度下限滑块"> — <input id="widthMax" type="number" min="0" value="" placeholder="不限" aria-label="最大宽度"> px</label><label>高度 <input id="height" type="number" min="0" value="0" aria-label="最小高度"><input id="heightRange" type="range" min="0" max="4096" value="0" aria-label="高度下限滑块"> — <input id="heightMax" type="number" min="0" value="" placeholder="不限" aria-label="最大高度"> px</label></div>
<div class="resource-toolbar"><select id="format" aria-label="格式"><option value="">全部格式</option></select><span id="count">0 / 0</span><label class="select-all"><input id="all" type="checkbox">全选</label><button id="invert" class="secondary">反选</button><button id="downloadSelected" class="secondary">下载</button><button id="packSelected" class="primary">打包 ZIP</button><button id="refresh" class="icon" title="重新读取">↻</button></div>
<details class="resource-options"><summary>筛选与命名</summary><label>URL <input id="query" placeholder="筛选资源地址或名称"></label><label>排序 <select id="resourceSort"><option value="auto">自动</option><option value="large">大图优先</option><option value="small">小图优先</option></select>预览 <select id="previewSize"><option value="small">小</option><option value="large">大</option></select></label><label>文件名 <input id="rename" value="{NAME}_{N}.{EXT}" aria-label="文件命名模板"></label><small>{NAME} 原名 · {N} 序号 · {DATE} 日期 · {EXT} 格式</small><label>ZIP 名称 <input id="archiveName" value="网页资源"></label><button id="exportLinks" class="secondary">导出资源链接</button></details>
<div id="list" class="resource-grid" aria-label="资源列表"></div><p class="muted">读取当前网页已加载、请求和声明的资源。滚动或播放后可重新读取；清单和分片请使用平台视频模式。ZIP 最多 200 项、2 GiB。</p></section>
<section id="settings" hidden><h1>偏好设置</h1><label class="toggle"><span>交给 SnowDown 桌面端下载<small id="routeHint">未连接时自动使用浏览器下载</small></span><input id="forward" type="checkbox"></label><label class="toggle"><span>连接后同步三平台账号<small>仅在本机传输，并由桌面端加密保存</small></span><input id="sync" type="checkbox"></label><label class="toggle"><span>视频下载入口<small>在视频封面或播放器旁显示下载按钮</small></span><input id="floating" type="checkbox"></label><button id="enableSites" class="secondary wide">启用更多平台与预览下载</button><p id="syncStatus" class="muted"></p><button id="syncNow" class="secondary wide">立即同步账号</button><button id="getDesktop" class="text wide">下载 SnowDown 桌面端 ↗</button><p class="muted">浏览器关闭或软件退出时，转发自动停用；软件再次运行后恢复已选择的联动偏好。网页资源读取需单独授权。可在浏览器扩展管理中撤回权限。</p></section>
<p id="message" role="status"></p></main><footer><span>v0.1.16 · 本地收藏</span><button id="openTab" class="text">在新标签页打开</button></footer><script type="module" src="popup.js"></script></body></html>
