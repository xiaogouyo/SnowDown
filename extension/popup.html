<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>SnowDown</title><link rel="stylesheet" href="style.css"></head><body class="popup-shell">
<header><button id="brand" title="切换平台视频／网页资源模式"><img src="icons/32.png" alt=""><strong>SnowDown<span>.</span></strong></button><span id="connection" class="badge">浏览器下载</span><button id="settingsButton" class="icon" title="设置">⚙</button></header>
<main>
<nav><button id="platformMode" class="active">平台视频</button><button id="resourceMode">网页资源</button></nav>
<section id="platform"><div class="intro"><span class="eyebrow">留住喜欢的内容</span><h1 id="pageTitle">当前页面视频</h1><p id="platformLabel">B站 · 抖音 · 小红书</p></div><button id="parse" class="primary wide">读取当前视频</button><article id="video" hidden><img id="cover" alt="视频封面"><div><h2 id="videoTitle"></h2><p id="author"></p><div id="quickFormats" class="quick-formats"></div></div><label>画质<select id="quality"></select></label><button id="downloadVideo" class="primary wide">下载视频</button></article></section>
<section id="resources" hidden><div class="tools"><select id="kind" aria-label="资源类型"><option value="all">全部资源</option><option value="video">视频</option><option value="image">图像</option><option value="audio">音频</option><option value="manifest">播放清单</option></select><select id="format" aria-label="格式"><option value="">全部格式</option><option>mp4</option><option>webm</option><option>jpg</option><option>png</option><option>webp</option><option>gif</option><option>avif</option></select><button id="refresh" class="secondary">刷新</button></div><div class="filters"><label>宽 ≥<input id="width" type="number" min="0" value="0"></label><label>高 ≥<input id="height" type="number" min="0" value="0"></label><input id="query" placeholder="搜索资源地址"></div><div class="selection"><label><input id="all" type="checkbox">全选</label><span id="count">0 项</span><button id="downloadSelected" class="primary">下载所选</button></div><p class="muted">仅列出页面已加载／已请求的资源；滚动或播放后刷新。分段清单、加密播放和 blob 流不能作为普通文件下载。</p><div id="list"></div></section>
<section id="settings" hidden><h1>偏好设置</h1><label class="toggle"><span>交给 SnowDown 桌面端下载<small id="routeHint">未连接时自动使用浏览器下载</small></span><input id="forward" type="checkbox"></label><label class="toggle"><span>连接后同步三平台账号<small>仅在本机传输，并由桌面端加密保存</small></span><input id="sync" type="checkbox"></label><label class="toggle"><span>视频悬浮球提醒<small>发现视频后从右侧出现，点击展开下载设置</small></span><input id="floating" type="checkbox"></label><button id="enableSites" class="secondary wide">启用更多平台与预览下载</button><p id="syncStatus" class="muted"></p><button id="syncNow" class="secondary wide">立即同步账号</button><button id="getDesktop" class="text wide">下载 SnowDown 桌面端 ↗</button><p class="muted">浏览器关闭或软件退出时，转发自动停用；软件再次运行后恢复已选择的联动偏好。网页资源读取需单独授权。可在浏览器扩展管理中撤回权限。</p></section>
<p id="message" role="status"></p></main><footer><span>v0.1.4 · 本地收藏</span><button id="openTab" class="text">在新标签页打开</button></footer><script type="module" src="popup.js"></script></body></html>
